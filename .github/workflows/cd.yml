# CD de festa-payment-service (SCRUM-45), igual que festa-auth-service.
# Construye la imagen y la publica en GitHub Container Registry (GHCR). El despliegue real en
# AWS se agrega como un paso adicional cuando llegue el laboratorio de créditos (SCRUM-134).
#
# El Dockerfile corre las pruebas (incluida la de contrato) y copia los contratos a la imagen,
# porque el inbox los usa en runtime: por eso se descargan de festa-infra como build-context.
#
# Publica solo cuando corre por un push real a `main`. En un PR o al lanzarlo a mano
# (workflow_dispatch) solo construye la imagen, para validar el Dockerfile sin publicar nada.
name: CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - src/**
      - migrations/**
      - .github/workflows/cd.yml
  workflow_dispatch:

# Sin permisos de escritura por defecto: solo el job de publicación recibe `packages: write`, y ese
# job solo corre en un push a `main`. Así un PR (incluso de una rama del mismo repo, que puede
# modificar este workflow) no puede publicar imágenes en GHCR.
permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # PR, lanzamiento manual o push a otra rama: solo construye la imagen (valida el Dockerfile y
  # corre las pruebas) con permisos de solo lectura.
  imagen:
    name: Build y publicar imagen en GHCR
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # TODO: cambiar a ref: main cuando festa-infra cierre su primer sprint con un PR
      # develop → main (hoy main solo tiene el README).
      - name: Descargar contratos de festa-infra
        uses: actions/checkout@v4
        with:
          repository: Desparcha2-SWNT/festa-infra
          ref: develop
          path: .festa-infra
          sparse-checkout: contracts

      - uses: docker/setup-buildx-action@v4

      - name: Metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/desparcha2-swnt/festa-payment-service
          tags: |
            type=sha

      - name: Build (sin publicar)
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: |
            contracts=.festa-infra/contracts
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Push a `main`: construye y publica. Es el único job con `packages: write`.
  publicar:
    name: Build y publicar imagen en GHCR
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # TODO: cambiar a ref: main cuando festa-infra cierre su primer sprint con un PR
      # develop → main (hoy main solo tiene el README).
      - name: Descargar contratos de festa-infra
        uses: actions/checkout@v4
        with:
          repository: Desparcha2-SWNT/festa-infra
          ref: develop
          path: .festa-infra
          sparse-checkout: contracts

      - uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/desparcha2-swnt/festa-payment-service
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build y publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: |
            contracts=.festa-infra/contracts
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
